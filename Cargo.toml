[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oxisoft/oxidrive"
homepage = "https://github.com/oxisoft/oxidrive"
keywords = ["sync", "e2ee", "encryption", "backup", "self-hosted"]
categories = ["cryptography", "filesystem"]

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "http2",
  "query",
  "tokio",
  "ws",
] }
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = { version = "1.8.7", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
fastcdc = { version = "5.0.0", default-features = false }
governor = "0.10.4"
hpke = { version = "0.14.1", default-features = false, features = [
  "alloc",
  "chacha",
  "hkdfsha2",
  "mlkem",
  "x25519",
] }
minicbor = { version = "2.3.0", features = ["alloc", "derive"] }
proptest = "1.11.0"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlx-toml",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = { version = "0.14.0", default-features = false }

oxisoft-drive-chunking = { version = "0.1.1", path = "crates/chunking" }
oxisoft-drive-core = { version = "0.1.1", path = "crates/core" }
oxisoft-drive-crypto = { version = "0.1.1", path = "crates/crypto" }
oxisoft-drive-proto = { version = "0.1.1", path = "crates/proto" }
oxisoft-drive-server = { version = "0.1.1", path = "crates/server" }
oxisoft-drive-server-postgres = { version = "0.1.1", path = "crates/server-postgres" }
oxisoft-drive-server-sqlite = { version = "0.1.1", path = "crates/server-sqlite" }
oxisoft-drive-server-store = { version = "0.1.1", path = "crates/server-store" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Selected restriction lints (engineering standards §4, Q-E2).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Dependencies (crypto especially) are optimised even in dev and test builds, so property
# tests over signatures and KEMs run in seconds; our own code stays unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 2
