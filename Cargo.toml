[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oxisoft/oxidrive"
homepage = "https://github.com/oxisoft/oxidrive"
keywords = ["sync", "e2ee", "encryption", "backup", "self-hosted"]
categories = ["cryptography", "filesystem"]

[workspace.dependencies]
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = { version = "1.8.7", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
hpke = { version = "0.14.1", default-features = false, features = [
  "alloc",
  "chacha",
  "hkdfsha2",
  "mlkem",
  "x25519",
] }
proptest = "1.11.0"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.0", features = ["derive"] }

oxisoft-drive-crypto = { version = "0.1.0", path = "crates/crypto" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Selected restriction lints (engineering standards §4, Q-E2).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Dependencies (crypto especially) are optimised even in dev and test builds, so property
# tests over signatures and KEMs run in seconds; our own code stays unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 2
